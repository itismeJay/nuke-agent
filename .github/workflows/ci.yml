name: CI

# Runs on every push to main and every PR targeting main.
# Deployment jobs live in this same file so they can depend on the gates via
# `needs:` — that is what guarantees "no deploy without a green pipeline".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer commit on a PR cancels the older in-progress run. A push to main is
# never cancelled — we want every main commit fully verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default. Individual jobs opt into more where they need it.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate: fast, deterministic checks.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # ---------------------------------------------------------------------------
  # Build gate: the real production compile with a clean (no-secret) env. Runs
  # in parallel with `quality`. Proves `next build` succeeds; the deployable
  # artifact is produced separately by `vercel build` in the deploy jobs.
  # ---------------------------------------------------------------------------
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The production build only needs these to be present and syntactically
    # valid — static generation never contacts Supabase. Real values live in
    # Vercel.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-not-a-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Database gate: tenant-isolation / RLS tests against a real Postgres.
  # Spins up the local Supabase stack (migrations auto-applied), then runs the
  # SQL assertions in tests/db/ — B cannot touch A's rows, composite FKs reject
  # cross-tenant children, anon sees nothing. See docs/project/CICD.md.
  # ---------------------------------------------------------------------------
  db-tests:
    name: Tenant isolation (RLS + composite FK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (migrations auto-applied)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Tenant-isolation tests
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:db
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # Security gate: secret scan + dependency audit. Parallel with the above.
  # ---------------------------------------------------------------------------
  security:
    name: Secret scan · Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs full history
          persist-credentials: false

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Blocks on high/critical only. Low/moderate are reported but not fatal —
      # rationale in docs/project/CICD.md → Dependency security.
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

  # ---------------------------------------------------------------------------
  # Preview deployment (PRs only). Inert until DEPLOY_ENABLED=true and the
  # VERCEL_* secrets exist. Never runs for forked PRs (no secret access).
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy preview
    needs: [quality, build, security, db-tests]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # to post the preview URL comment
    environment:
      name: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull Vercel preview env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59 build --token="$VERCEL_TOKEN"

      - name: Deploy (prebuilt)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@59 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/smoke.sh "$DEPLOY_URL"

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          body="**Preview:** $DEPLOY_URL — smoke test passed ✅"
          gh pr comment "$PR_NUMBER" --edit-last --body "$body" \
            || gh pr comment "$PR_NUMBER" --body "$body"

  # ---------------------------------------------------------------------------
  # Production deployment (push to main only). Inert until DEPLOY_ENABLED=true.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy production
    needs: [quality, build, security, db-tests]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never run two production deploys at once; let a running one finish.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull Vercel production env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (Vercel, production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy (prebuilt, production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@59 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/smoke.sh "$DEPLOY_URL"
